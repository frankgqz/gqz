<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>

    <!-- Theme persistence: applies saved theme before CSS paints -->
    <script>
      (function() {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
          var parts = cookies[i].trim().split('=');
          if (parts[0] !== 'gqz-theme') continue;
          var theme = parts[1];
        if (theme === 'dark') theme = 'night';
        if (theme === 'sky') theme = 'bubble';
        var themes = {
          wood:   { bg: '#1a120b', text: '#f5e6d3', subtext: '#b8956a', accent: '#d4a574' },
          night:  { bg: '#131316', text: '#f5f5f5', subtext: '#959AA3', accent: '#FF6A1F' },
          bubble: { bg: '#EAF6FF', text: '#2E4A6B', subtext: '#7FA8D6', accent: '#FF8FC5' },
          matcha: { bg: '#f0f4e8', text: '#2d3a1f', subtext: '#6b7a52', accent: '#7a9e3f' }
        };
        if (!themes[theme]) return;
          var t = themes[theme];
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.setProperty('--theme-bg', t.bg);
          root.style.setProperty('--theme-text', t.text);
          root.style.setProperty('--theme-subtext', t.subtext);
          root.style.setProperty('--theme-accent', t.accent);
          return;
        }
      })();
    </script>

    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
